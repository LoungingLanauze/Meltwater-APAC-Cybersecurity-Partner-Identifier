<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meltwater APAC Cybersecurity Partner Identifier</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8f7f4;
    --card: #ffffff;
    --border: rgba(0,0,0,0.1);
    --border-med: rgba(0,0,0,0.18);
    --text-primary: #1a1a18;
    --text-secondary: #5a5a55;
    --text-muted: #9a9a93;
    --purple: #534AB7;
    --purple-light: #EEEDFE;
    --purple-mid: #AFA9EC;
    --purple-dark: #26215C;
    --radius-md: 8px;
    --radius-lg: 14px;
    --radius-xl: 20px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --card: #1e1e24;
      --border: rgba(255,255,255,0.1);
      --border-med: rgba(255,255,255,0.18);
      --text-primary: #e8e8e2;
      --text-secondary: #9a9a93;
      --text-muted: #5a5a55;
      --purple-light: #2a2756;
      --purple-mid: #534AB7;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 0;
  }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--purple-dark);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    height: 56px;
    gap: 12px;
  }
  .topbar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar-logo svg { flex-shrink: 0; }
  .topbar-title {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.01em;
  }
  .topbar-sep { width: 1px; height: 20px; background: rgba(255,255,255,0.2); margin: 0 4px; }
  .topbar-sub { font-size: 13px; color: rgba(255,255,255,0.55); }

  /* ── MAIN LAYOUT ── */
  .main { max-width: 780px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

  /* ── TABS ── */
  .tab-bar {
    display: flex;
    gap: 0;
    border-bottom: 1.5px solid var(--border);
    margin-bottom: 2rem;
  }
  .tab {
    padding: 10px 22px;
    font-size: 14px;
    cursor: pointer;
    color: var(--text-secondary);
    border: none;
    background: none;
    border-bottom: 2.5px solid transparent;
    margin-bottom: -1.5px;
    transition: color .15s, border-color .15s;
    font-family: inherit;
  }
  .tab:hover { color: var(--purple); }
  .tab.active { color: var(--purple); border-bottom-color: var(--purple); font-weight: 500; }

  .view { display: none; }
  .view.active { display: block; }

  /* ── QUIZ ── */
  .progress-row { display: flex; gap: 5px; margin-bottom: 10px; }
  .pip { height: 4px; flex: 1; background: var(--border); border-radius: 2px; transition: background .3s; }
  .pip.done { background: var(--purple); }
  .pip.active { background: var(--purple-mid); }

  .step-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .question { font-size: 20px; font-weight: 500; color: var(--text-primary); margin-bottom: 1.5rem; line-height: 1.45; }

  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 14px 18px;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
    background: var(--card);
  }
  .opt:hover { border-color: var(--purple-mid); background: var(--purple-light); transform: translateY(-1px); }
  .opt.selected { border-color: var(--purple); background: var(--purple-light); }
  .opt-icon { font-size: 22px; color: var(--text-muted); flex-shrink: 0; margin-top: 1px; }
  .opt.selected .opt-icon { color: var(--purple); }
  .opt-body { flex: 1; }
  .opt-title { font-size: 14px; font-weight: 500; color: var(--text-primary); }
  .opt-sub { font-size: 12px; color: var(--text-secondary); margin-top: 3px; line-height: 1.4; }

  .nav { display: flex; gap: 10px; margin-top: 1.5rem; align-items: center; }
  .btn {
    padding: 9px 22px; border-radius: var(--radius-md); font-size: 14px;
    cursor: pointer; border: 1px solid var(--border-med);
    background: var(--card); color: var(--text-primary);
    font-family: inherit; transition: background .15s, transform .1s;
  }
  .btn:hover { background: var(--purple-light); }
  .btn:active { transform: scale(0.98); }
  .btn.primary { background: var(--purple); color: #fff; border-color: var(--purple); }
  .btn.primary:hover { background: #3C3489; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .nav-hint { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  /* ── RESULT ── */
  .result-hero {
    background: linear-gradient(135deg, #2d2a6e 0%, #534AB7 100%);
    border-radius: var(--radius-xl);
    padding: 2rem;
    margin-bottom: 1.5rem;
    color: #fff;
  }
  .result-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.2); border-radius: 20px;
    padding: 4px 14px; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.06em;
    margin-bottom: 14px;
  }
  .result-name { font-size: 28px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
  .result-tagline { font-size: 14px; opacity: 0.8; line-height: 1.5; max-width: 520px; }

  .section-title { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }

  .reasons { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.5rem; }
  .reason {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--purple);
    border-radius: var(--radius-md);
    font-size: 13px; color: var(--text-secondary); line-height: 1.5;
  }
  .reason-check { color: var(--purple); flex-shrink: 0; margin-top: 1px; font-size: 16px; }

  .also-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
  .also-card {
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
  }
  .also-name { font-size: 14px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; }
  .also-note { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }

  .ref-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 6px; margin-bottom: 1.5rem; }
  .ref-link {
    text-align: center; padding: 8px; font-size: 12px;
    border: 1px solid var(--border); border-radius: var(--radius-md);
    color: var(--purple); text-decoration: none;
    transition: background .15s;
  }
  .ref-link:hover { background: var(--purple-light); }

  .result-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* ── CONTACT BLOCK ── */
  .contact-block { margin-bottom: 1.5rem; }
  .contact-cards { display: flex; gap: 10px; flex-wrap: wrap; }
  .contact-card {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    text-decoration: none;
    flex: 1; min-width: 200px;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .contact-card:hover { border-color: #4A9EDB; background: #EBF5FF; transform: translateY(-1px); }
  .contact-card.group-dm { border-color: var(--purple-mid); }
  .contact-card.group-dm:hover { border-color: var(--purple); background: var(--purple-light); }
  .contact-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; flex-shrink: 0; color: #fff;
  }
  .contact-name { font-size: 14px; font-weight: 500; color: var(--text-primary); }
  .contact-role { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .contact-slack { font-size: 11px; color: #4A9EDB; margin-top: 3px; display: flex; align-items: center; gap: 4px; }
  @media (prefers-color-scheme: dark) {
    .contact-card:hover { background: #1a2a38; border-color: #4A9EDB; }
  }

  /* ── PARTNER OVERVIEW ── */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1.5rem; }
  .chip {
    padding: 7px 16px; border-radius: 24px; font-size: 13px; cursor: pointer;
    border: 1px solid var(--border-med); background: var(--card); color: var(--text-secondary);
    transition: all .15s; font-family: inherit; font-weight: 500;
  }
  .chip:hover { border-color: var(--purple-mid); color: var(--purple); }
  .chip.active { background: var(--purple); color: #fff; border-color: var(--purple); }

  .partner-card {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    overflow: hidden;
    animation: fadeIn .2s ease;
  }
  .partner-card.shown { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .pc-header { padding: 1.5rem 2rem; display: flex; align-items: flex-start; gap: 16px; }
  .pc-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
  .pc-name { font-size: 22px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; letter-spacing: -0.02em; }
  .pc-tagline { font-size: 14px; color: var(--text-secondary); line-height: 1.5; }

  .pc-body { padding: 0 2rem 2rem; }
  .pc-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.25rem; }
  .pc-tag { font-size: 11px; padding: 4px 12px; border-radius: 20px; font-weight: 500; }

  .pc-section-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; }

  .uc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-bottom: 1.25rem; }
  .uc-item {
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--bg);
  }
  .uc-title { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 3px; }
  .uc-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }

  .pc-signals { display: flex; flex-direction: column; gap: 6px; margin-bottom: 1.25rem; }
  .signal { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--text-secondary); line-height: 1.45; }
  .signal-icon { flex-shrink: 0; font-size: 16px; }

  .pc-footer { padding: 1rem 2rem; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: gap; }
  .pc-url { font-size: 13px; color: var(--purple); text-decoration: none; }
  .pc-url:hover { text-decoration: underline; }

  /* ── PRODUCT CARDS (Blackbird Compass / RAV3N) ── */
  .product-cards { display: flex; flex-direction: column; gap: 14px; margin-bottom: 1.25rem; }
  .product-card {
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--card);
  }
  .product-card-header { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--border); }
  .product-card-name { font-size: 14px; font-weight: 500; color: var(--text-primary); }
  .product-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; white-space: nowrap; }
  .product-card-body { padding: 12px 16px; }
  .product-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 12px; }
  .pricing-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  .pricing-table tr { border-bottom: 1px solid var(--border); }
  .pricing-table tr:last-child { border-bottom: none; }
  .pricing-table td { padding: 6px 4px; font-size: 12px; vertical-align: top; }
  .pricing-table td:first-child { color: var(--text-muted); width: 44%; }
  .pricing-table td:last-child { color: var(--text-primary); font-weight: 500; }
  .pricing-table .margin-row td:last-child { color: #1D9E75; }
  .product-note { font-size: 11px; color: var(--text-muted); line-height: 1.5; padding: 8px 10px; background: var(--bg); border-radius: var(--radius-md); margin-bottom: 10px; }
  .product-slide-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: #1D9E75; text-decoration: none;
    padding: 6px 12px; border: 1px solid #9FE1CB;
    border-radius: var(--radius-md); transition: background .15s;
  }
  .product-slide-link:hover { background: #E1F5EE; }

  .collateral-link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: var(--radius-md);
    font-size: 13px; font-weight: 500; text-decoration: none;
    background: var(--purple-light); color: var(--purple);
    border: 1px solid var(--purple-mid);
    transition: background .15s, transform .1s;
  }
  .collateral-link:hover { background: #CECBF6; transform: translateY(-1px); }
  .flowchart-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 1.5rem; }
  .flowchart-wrap svg { display: block; margin: 0 auto; }

  /* ── FOOTER ── */
  .page-footer { text-align: center; margin-top: 3rem; font-size: 12px; color: var(--text-muted); line-height: 1.6; }

  /* ── ICONS (inline SVG approach for portability) ── */
  .icon { display: inline-block; vertical-align: middle; width: 20px; height: 20px; }

  @media (max-width: 540px) {
    .main { padding: 1.5rem 1rem 3rem; }
    .result-name { font-size: 22px; }
    .pc-header { padding: 1.25rem; }
    .pc-body { padding: 0 1.25rem 1.25rem; }
  }
</style>
</head>

function buildContactHTML(contacts, compact=false) {
  if (contacts.length > 1) {
    const ids = contacts.map(cid => CONTACTS[cid].slackId).join(',');
    const groupLink = `slack://users?ids=${ids}`;
    const avatarSize = compact ? '32px' : '40px';
    const fontSize = compact ? '12px' : '13px';
    return `<a class="contact-card group-dm" href="${groupLink}">
      <div style="display:flex;gap:-6px;position:relative;width:${compact?'52px':'60px'};flex-shrink:0">
        ${contacts.map((cid,i) => `<div class="contact-avatar" style="background:${CONTACTS[cid].color};width:${avatarSize};height:${avatarSize};font-size:${fontSize};position:${i>0?'absolute':'relative'};${i>0?`left:${compact?'18px':'22px'};`:''}border:2px solid var(--card)">${CONTACTS[cid].initials}</div>`).join('')}
      </div>
      <div>
        <div class="contact-name" style="font-size:${compact?'13px':'14px'}">${contacts.map(cid=>CONTACTS[cid].name.split(' ')[0]).join(' & ')}</div>
        <div class="contact-role" style="font-size:11px">Partner Managers</div>
        <div class="contact-slack">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.14 13.5 19.79 19.79 0 0 1 1.08 4.86 2 2 0 0 1 3.05 2.68h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21 17z"/></svg>
          Open group DM in Slack ↗
        </div>
      </div>
    </a>`;
  } else {
    const c = CONTACTS[contacts[0]];
    const avatarSize = compact ? '34px' : '40px';
    return `<a class="contact-card" href="${c.slack}" target="_blank">
      <div class="contact-avatar" style="background:${c.color};width:${avatarSize};height:${avatarSize};font-size:${compact?'13px':'15px'}">${c.initials}</div>
      <div>
        <div class="contact-name" style="font-size:${compact?'13px':'14px'}">${c.name}</div>

let answers = {}, current = 0, selected = null;

function isMulti() { return !!getQuestions()[current].multiselect; }

function renderQuestion() {
  const QUESTIONS = getQuestions();
  const q = QUESTIONS[current];
  const pips = document.getElementById('progress');
  pips.innerHTML = QUESTIONS.map((_,i) => `<div class="pip ${i<current?'done':i===current?'active':''}"></div>`).join('');
  document.getElementById('step-label').textContent = `Question ${current+1} of ${QUESTIONS.length}`;
  document.getElementById('question-text').textContent = q.text;

  // For multi-select, selected is an array; for single, a string
  if (q.multiselect) {
    selected = answers[q.id] || [];
  } else {
    selected = answers[q.id] || null;
  }

  const hint = q.multiselect ? '<span style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:1rem">✦ Select all that apply</span>' : '';
  document.getElementById('opts-list').innerHTML = hint + q.opts.map(o => {
    const isSelected = q.multiselect ? (selected||[]).includes(o.id) : selected===o.id;
    return `<div class="opt ${isSelected?'selected':''}" onclick="selectOpt('${o.id}',this)">
      <span class="opt-icon">${o.icon}</span>
      <div class="opt-body">
        <div class="opt-title">${o.title}</div>
        <div class="opt-sub">${o.sub}</div>
      </div>
      ${q.multiselect ? `<span class="opt-check" style="flex-shrink:0;width:20px;height:20px;border-radius:4px;border:1.5px solid var(--border-med);display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;background:${isSelected?'var(--purple)':'transparent'};border-color:${isSelected?'var(--purple)':'var(--border-med)'};">${isSelected?'✓':''}</span>` : ''}
    </div>`;
  }).join('');

  document.getElementById('btn-back').disabled = current===0;
  const hasSelection = q.multiselect ? (selected||[]).length > 0 : !!selected;
  document.getElementById('btn-next').disabled = !hasSelection;
  document.getElementById('nav-hint').textContent = hasSelection ? '' : 'Select an option to continue';
}

function selectOpt(id, el) {
  const q = getQuestions()[current];
  if (q.multiselect) {
    if (!Array.isArray(selected)) selected = [];
    const idx = selected.indexOf(id);
    if (idx > -1) { selected.splice(idx, 1); }
    else { selected.push(id); }
    answers[q.id] = [...selected];
    renderQuestion();
  } else {
    selected = id;
    answers[q.id] = id;
    // If sector changes, clear downstream answers so context-aware questions reset
    if (q.id === 'sector') {
      delete answers.threat_type;
      delete answers.urgency;
      delete answers.mw_context;
    }
    document.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('btn-next').disabled = false;
    document.getElementById('nav-hint').textContent = '';
  }
}

function goNext() {
  const QUESTIONS = getQuestions();
  const hasSelection = isMulti() ? (selected||[]).length > 0 : !!selected;
  if (!hasSelection) return;
  if (current < QUESTIONS.length-1) { current++; renderQuestion(); }
  else showResult();
}

function goBack() {
  if (current > 0) { current--; renderQuestion(); }
}

function scorePartners() {
  const s = answers, sc = {cyabra:0,blackbird:0,cyfirma:0,cognyte:0,cyberglobes:0};
  if (s.sector==='gov') { sc.cyberglobes+=4; sc.cyabra+=3; sc.blackbird+=2; sc.cognyte+=2; }
  if (s.sector==='corp') { sc.cyfirma+=3; sc.blackbird+=3; sc.cyabra+=2; sc.cognyte+=3; }
  if (s.sector==='both') { sc.blackbird+=2; sc.cyabra+=2; sc.cognyte+=2; sc.cyfirma+=1; }

  // threat_type is now an array
  const threats = Array.isArray(s.threat_type) ? s.threat_type : (s.threat_type ? [s.threat_type] : []);
  if (threats.includes('social_disinfo')) { sc.cyabra+=5; sc.blackbird+=3; }
  if (threats.includes('cyber_tech')) { sc.cyfirma+=5; sc.cognyte+=4; }
  if (threats.includes('narrative')) { sc.blackbird+=6; sc.cyabra+=2; }
  if (threats.includes('osint_intel')) { sc.cyberglobes+=6; sc.cyabra+=2; }
  if (threats.includes('not_sure')) { sc.blackbird+=2; sc.cyfirma+=2; sc.cyabra+=2; sc.cognyte+=1; }

  const urgencies = Array.isArray(s.urgency) ? s.urgency : (s.urgency ? [s.urgency] : []);
  if (urgencies.includes('brand')) { sc.cyabra+=4; sc.blackbird+=3; sc.cyfirma+=1; }
  if (urgencies.includes('crisis')) { sc.cyabra+=3; sc.blackbird+=4; sc.cognyte+=2; }
  if (urgencies.includes('security_ops')) { sc.cyfirma+=5; sc.cognyte+=5; }
  if (urgencies.includes('election_gov')) { sc.cyabra+=4; sc.cyberglobes+=4; sc.blackbird+=2; }
  if (urgencies.includes('market_financial')) { sc.blackbird+=5; sc.cyfirma+=2; sc.cognyte+=2; }
  if (urgencies.includes('takedown')) { sc.cyabra+=5; sc.cognyte+=4; }
  if (s.mw_context==='addon') { sc.cyabra+=2; sc.blackbird+=2; }
  if (s.mw_context==='strategic') { sc.cyfirma+=2; sc.cognyte+=2; sc.cyberglobes+=1; }
  if (s.mw_context==='both_mw') { sc.blackbird+=2; sc.cyfirma+=1; sc.cyabra+=1; }
  return sc;
}

function showResult() {
  document.getElementById('quiz-screen').style.display='none';
  const scores = scorePartners();
  const THRESHOLD = 0.65; // show partners scoring >= 65% of top score
  const sorted = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const topScore = sorted[0][1];

  // Determine recommended partners — always at least 1, up to 3 if scores are close
  const recommended = sorted
    .filter(([id, score]) => score >= topScore * THRESHOLD && score > 0)
    .slice(0, 3)
    .map(([id]) => id);

  const rs = document.getElementById('result-screen');
  rs.style.display = 'block';

  const positioningNote = recommended.length > 1 ? getPositioningNote(recommended) : null;
  const multiHeader = recommended.length > 1
    ? `<div style="background:var(--purple-light);border:1px solid var(--purple-mid);border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-bottom:1.5rem;">
        <div style="font-size:13px;font-weight:600;color:var(--purple);margin-bottom:6px;">🎯 Multiple partners recommended</div>
        <div style="font-size:13px;color:var(--text-secondary);line-height:1.5;">Based on the client's combined threat concerns, <strong>${recommended.map(id=>PARTNERS[id].name).join(' + ')}</strong> can be positioned together.</div>
        ${positioningNote ? `<div style="margin-top:8px;font-size:13px;color:var(--text-secondary);line-height:1.5;border-top:1px solid var(--purple-mid);padding-top:8px;">💡 ${positioningNote}</div>` : ''}
      </div>` : '';

  const otherIds = sorted.slice(recommended.length, recommended.length+2).map(([id])=>id).filter(id => scores[id] > 0);

  rs.innerHTML = `
    ${multiHeader}
    ${recommended.map((pid, i) => buildPartnerResultCard(pid, i+1)).join('')}
    ${otherIds.length ? `
    <div class="section-title" style="margin-bottom:12px">Others worth exploring</div>
    <div class="also-grid" style="margin-bottom:1.5rem">
      ${otherIds.map(id=>`<div class="also-card">

      </div>`).join('')}
    </div>` : ''}
    <div class="section-title" style="margin-bottom:10px">All partner websites</div>
    <div class="ref-grid" style="margin-bottom:1.5rem">
      ${Object.entries(PARTNERS).map(([id,p])=>`<a class="ref-link" href="${p.url}" target="_blank" style="color:${p.color}">${p.name} ↗</a>`).join('')}
    </div>
    <div class="result-actions">
      <button class="btn" onclick="restart()">← Start over</button>
      <button class="btn primary" onclick="switchTab('overview');showPartner('${recommended[0]}')">View partner profiles →</button>
    </div>`;
}

                  ${prod.pricing.map((row,i) => `<tr class="${row.label.toLowerCase().includes('margin') ? 'margin-row' : ''}"><td>${row.label}</td><td>${row.value}</td></tr>`).join('')}
                </table>
                <div class="product-note">💡 ${prod.note}</div>
                <a class="product-slide-link" href="${prod.slideUrl}" target="_blank">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                  ${prod.slideLabel}
                </a>
              </div>
            </div>`).join('')}
        </div>` : ''}
      </div>
      <div class="pc-footer">
        <a href="${p.url}" target="_blank" class="pc-url">${p.url} ↗</a>
        <button class="btn primary" onclick="switchTab('quiz')">Run questionnaire →</button>
      </div>
      <div style="padding:0 2rem 1.5rem">
        <div class="pc-section-title" style="margin-bottom:8px">Who to engage</div>
        <div class="contact-cards">
          ${buildContactHTML(p.contacts, true)}
        </div>
      </div>
    </div>`).join('');
  showPartner('cyabra');
}

function showPartner(id) {
  document.querySelectorAll('.partner-card').forEach(c=>c.classList.remove('shown'));
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  document.getElementById('pc-'+id).classList.add('shown');
  document.getElementById('chip-'+id).classList.add('active');
}

renderQuestion();
buildOverview();
</script>
</body>
</html>
